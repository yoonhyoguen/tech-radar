<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('기사', false)}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments/layout :: sidebar('articles')}"></ul>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments/layout :: topbar('기사 목록')}"></nav>

            <div class="container-fluid">
                <form class="form-inline mb-3" th:action="@{/articles}" method="get">
                    <input type="text" name="q" class="form-control mr-2 mb-2" placeholder="제목 검색 (예: 生成AI)"
                           th:value="${q}">
                    <select name="sourceId" class="form-control mr-2 mb-2">
                        <option value="">전체 소스</option>
                        <option th:each="s : ${sources}" th:value="${s.id}" th:text="${s.name}"
                                th:selected="${s.id == sourceId}"></option>
                    </select>
                    <button type="submit" class="btn btn-primary mb-2"><i class="fas fa-search"></i> 검색</button>
                </form>

                <div class="card shadow mb-4">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary"
                            th:text="|검색 결과 ${#numbers.formatInteger(articles.totalElements, 1, 'COMMA')}건|">검색 결과</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover table-sm">
                                <thead>
                                <tr><th>제목</th><th style="width: 160px;">출처</th><th style="width: 150px;">게시</th><th style="width: 150px;">수집</th></tr>
                                </thead>
                                <tbody>
                                <tr th:each="a : ${articles.content}">
                                    <td>
                                        <a th:href="${a.url}" target="_blank" rel="noopener noreferrer" th:text="${a.title}"></a>
                                        <div th:if="${a.summary != null and a.summary != a.title}" class="small text-gray-600"
                                             th:text="${a.summary}"></div>
                                    </td>
                                    <td th:text="${a.source.name}"></td>
                                    <td class="small" th:text="${@fmt.dt(a.publishedAt)}"></td>
                                    <td class="small" th:text="${@fmt.dt(a.firstSeenAt)}"></td>
                                </tr>
                                <tr th:if="${articles.empty}">
                                    <td colspan="4" class="text-center text-gray-500">조건에 맞는 기사가 없습니다.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>

                        <nav th:if="${articles.totalPages > 1}"
                             th:with="cur=${articles.number}, last=${articles.totalPages - 1},
                                      from=${cur - 4 < 0 ? 0 : cur - 4}, to=${cur + 4 > last ? last : cur + 4}">
                            <ul class="pagination pagination-sm justify-content-center mb-0">
                                <li class="page-item" th:classappend="${articles.first} ? 'disabled'">
                                    <a class="page-link" th:href="@{/articles(q=${q}, sourceId=${sourceId}, page=${cur - 1})}">이전</a>
                                </li>
                                <li th:each="i : ${#numbers.sequence(from, to)}" class="page-item"
                                    th:classappend="${i == cur} ? 'active'">
                                    <a class="page-link" th:href="@{/articles(q=${q}, sourceId=${sourceId}, page=${i})}"
                                       th:text="${i + 1}"></a>
                                </li>
                                <li class="page-item" th:classappend="${articles.last} ? 'disabled'">
                                    <a class="page-link" th:href="@{/articles(q=${q}, sourceId=${sourceId}, page=${cur + 1})}">다음</a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
