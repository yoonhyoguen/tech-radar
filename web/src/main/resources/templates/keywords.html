<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('키워드', false)}"></head>
<body id="page-top">
<div id="wrapper">
    <ul th:replace="~{fragments/layout :: sidebar('keywords')}"></ul>

    <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
            <nav th:replace="~{fragments/layout :: topbar('관심 키워드')}"></nav>

            <div class="container-fluid">
                <div th:replace="~{fragments/layout :: flash}"></div>

                <form class="form-inline mb-3" th:action="@{/keywords}" method="post">
                    <input type="text" name="word" class="form-control mr-2 mb-2" maxlength="100" required
                           placeholder="예: 生成AI, マイナンバー, 반도체">
                    <button type="submit" class="btn btn-primary mb-2"><i class="fas fa-plus"></i> 등록</button>
                </form>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">등록된 키워드</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-sm mb-0">
                                    <thead><tr><th>키워드</th><th>등록</th><th></th></tr></thead>
                                    <tbody>
                                    <tr th:each="k : ${keywords}">
                                        <td>
                                            <a th:href="@{/articles(q=${k.word})}" th:text="${k.word}"></a>
                                        </td>
                                        <td class="small" th:text="${@fmt.dt(k.createdAt)}"></td>
                                        <td class="text-right">
                                            <form th:action="@{/keywords/{id}/delete(id=${k.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(keywords)}">
                                        <td colspan="3" class="text-center text-gray-500">등록된 키워드가 없습니다.</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card shadow mb-4">
                            <div class="card-header py-3">
                                <h6 class="m-0 font-weight-bold text-primary">최근 7일 등장 횟수 TOP 10</h6>
                            </div>
                            <div class="card-body">
                                <table class="table table-sm mb-0">
                                    <thead><tr><th>키워드</th><th class="text-right">기사 수</th></tr></thead>
                                    <tbody>
                                    <tr th:each="t : ${top}">
                                        <td th:text="${t.label}"></td>
                                        <td class="text-right" th:text="${t.cnt}"></td>
                                    </tr>
                                    </tbody>
                                </table>
                                <p class="small text-gray-500 mt-3 mb-0">제목에 키워드가 포함된 기사를 셉니다 (대소문자 무시, 부분 일치).</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
